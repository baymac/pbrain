[package]
name = "plane-app"
version = "0.1.0"
description = "Plane desktop app with plane:// deep linking"
authors = ["parichay"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "plane_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
url = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
